- aid: bluecore:bluecore-events-api
  name: Bluecore Events API
  description: >-
    Bluecore's event-ingestion API - POST shopper behaviour and identity events (viewed_product, search,
    add_to_cart, remove_from_cart, wishlist, purchase, customer_patch, identify, optin, unsubscribe, plus
    per-tenant custom events) from a mobile app or any server-side source, doing the same job the Bluecore
    website JavaScript tag does for a storefront. Authenticated by the tenant token carried inside the
    JSON request body. Documented in prose only - Bluecore publishes no OpenAPI and no AsyncAPI for this
    surface.
  humanURL: https://help.bluecore.com/help/events-api
  baseURL: https://api.bluecore.app/api/track/mobile/v1
