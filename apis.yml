aid: bluecore
name: Bluecore
description: >-
  Bluecore is a retail marketing technology platform that unifies shopper identity, behavior,
  and product data into a customer data platform with 20+ predictive AI models, cross-channel
  experience orchestration (email, SMS, site, paid media), and AI shopping and marketing agents.
  Its public developer API (developers.bluecore.com) exposes OAuth 2.0 client-credentials
  authentication, Customer Profile management, eligibility (consent) management, and Communicate
  surfaces for transactional and direct-send messaging. Customers include Wayfair, Gap, J.Crew,
  Lenovo, CVS, and Fender. Backed by Norwest Venture Partners and Techstars.
url: https://raw.githubusercontent.com/api-evangelist/bluecore/refs/heads/main/apis.yml
accessModel:
  pricing: quote
  onboarding: sales-gated
  trial: false
  try_now: false
  public: false
  label: Contact sales
  confidence: high
  source:
  - https://www.bluecore.com/request-a-demo/
  - plans/bluecore-plans-pricing.yml
  generated: '2026-08-13'
  method: searched
  note: >-
    Corrected 2026-08-13. The prior derived value said "self-serve signup", which the evidence does
    not support: www.bluecore.com/pricing/ returns 404, there is no free tier or trial, and API
    credentials are issued by Bluecore to existing customers (the legacy transactional contract
    tells developers to email support@bluecore.com for a key). The only commercial entry point is
    a demo request.
