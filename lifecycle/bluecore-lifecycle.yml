  sunset_announced: false
  sunset_date: null
  detail: >-
    Bluecore's own OpenAPI repository README states "since we're going to be migrating away from
    this API (Q1 2025), it's not worth implementing an automated deployment" — an explicit
    statement of intent to retire the api.bluecore.com/email/ transactional surface in favour of
    the OAuth-authenticated transactional endpoints on a.bluecore.com/api. As of 2026-08-13 that
    migration is NOT reflected on the customer-facing surface: the docs page at
    www.bluecore.com/transactional-api-docs/ still returns 200, the spec is still served from the
    public GCS bucket, and neither carries a deprecation notice, a sunset date, a migration guide,
    or a link to the replacement. The retirement is announced only inside a developer README that
    no integrator is directed to read. This is a deprecation-communication gap, not a deprecation
    policy — the `deprecation.policy_url` above remains null.
