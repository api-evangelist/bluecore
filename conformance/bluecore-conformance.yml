standards:
- id: oauth2-client-credentials
  conforms: true
  evidence: >-
    Authentication uses the OAuth 2.0 client-credentials grant (POST auth.bluecore.com/oauth/token,
    grant_type client_credentials) issuing 24h Bearer tokens with resource:verb scopes.
- id: oidc
  conforms: partial
  evidence: >-
    CORRECTED 2026-08-13. Bluecore DOES serve an OpenID Connect Discovery 1.0 document at
    https://auth.bluecore.com/.well-known/openid-configuration (HTTP 200), advertising
    id_token/code/token response types, the openid/profile/email scope set, RS256 and a JWKS at
    /.well-known/jwks.json. It is an Auth0 tenant on Bluecore's own auth.bluecore.com custom
    domain — the same issuer that mints Bluecore API access tokens. The public API contract itself
    is still machine-to-machine client-credentials only and returns no id_token, so OIDC is
    published at the authorization server but not exercised by the documented API flow.
    Saved: well-known/bluecore-openid-configuration.json.
- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  evidence: >-
    https://auth.bluecore.com/.well-known/oauth-authorization-server returns RFC 8414 metadata
    (HTTP 200): issuer, token_endpoint https://auth.bluecore.com/oauth/token, revocation_endpoint,
    registration_endpoint, jwks_uri, code_challenge_methods_supported [S256, plain], and
    token_endpoint_auth_methods_supported [client_secret_basic, client_secret_post,
    private_key_jwt, none]. Saved: well-known/bluecore-oauth-authorization-server.json.
