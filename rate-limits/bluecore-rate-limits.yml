notes: >-
  New API endpoints are rate limited per account using a fixed-window algorithm with two
  windows: burst (1-second) and steady (1-minute). Documented per-endpoint limits (customer,
  eligibility) are burst 100/s and steady 1000/m. The exact limit differs per API and is
  echoed on every response via the RateLimit-* headers.
