cdn_distribution:
- name: Bluecore Website Integration loader (triggermail.js)
  registry: cdn
  url: 'https://api.bluecore.com/triggermail.js/{site_id}.js'
  version: null
  published: null
  official: true
  api_client: false
  note: >-
    The website tag is distributed per-tenant from a Google Cloud Storage bucket fronted by
    api.bluecore.com and is NOT pinned to a version in the URL — the path carries the customer's
    site id, not a release. There is no registry or CDN metadata endpoint to query, and an
    integrator cannot tell which build they are loading. Probing the path with a placeholder id
    returns GCS NoSuchKey (HTTP 404), confirming the bucket-backed per-tenant scheme.
    See components/bluecore-components.yml.
