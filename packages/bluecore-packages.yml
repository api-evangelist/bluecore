notes: >-
  Bluecore publishes NO first-party client library for any of its APIs. Every public registry was
  queried unauthenticated on 2026-08-13 and none returned a Bluecore-published API client:
  npm search "bluecore" returns only third-party or unrelated packages; pypi.org/pypi/bluecore/json,
  /bluecore-api/json and /bluecore-sdk/json all 404; rubygems search returns an empty array;
  crates.io returns total 0; packagist returns only unrelated "bluecore"-named projects. The
  developer portal (developers.bluecore.com) and the help centre's own "Developer resources" page
  list APIs, data feeds and pixels but no SDK, client library, CLI or Postman collection.
  Consumers are expected to call the REST endpoints directly.
